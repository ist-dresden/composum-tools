<div class="modal fade tools-dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form class="tools-dialog_form" method="post" action="${attr:dialog.action}" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">${dialog.title}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="tools-dialog_error d-none"></p>
                    <p>${dialog.message}</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>
