<div class="modal fade tools-dialog" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form class="tools-dialog_form" method="post" action="${attr:dialog.action}" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Change Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="tools-dialog_error d-none"></p>
                    <p class="text-muted">Profile properties are a free-form name/value set - add, edit or remove as needed.</p>
                    <div class="usermgr-page_profile-list">
                        ${each.entry:profile.entries;'/sling/usermgr/dialogs/changeProfileEntry.html'}
                    </div>
                    <button type="button" class="usermgr-page_profile-add btn btn-sm btn-dark">
                        <i class="bi bi-plus-lg"></i> Add Property</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
