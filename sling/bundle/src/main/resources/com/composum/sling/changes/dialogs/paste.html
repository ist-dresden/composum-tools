<div class="modal fade tools-dialog" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form class="tools-dialog_form" method="post" action="${attr:dialog.action}" enctype="multipart/form-data">
                <input type="hidden" name="source" value="${attr:paste.source}">
                <div class="modal-header">
                    <h5 class="modal-title">Paste Node</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="tools-dialog_error d-none"></p>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" value="${attr:paste.name}" required>
                    </div>
                    <small class="text-muted">Pasting '${paste.source}' here; a name already used by
                        another node at this location will fail, so pick a different one to
                        duplicate the node here rather than replace it.</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Paste</button>
                </div>
            </form>
        </div>
    </div>
</div>
