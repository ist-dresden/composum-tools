<div class="packages-page_filter-root">
    <div class="row g-2 align-items-end">
        <div class="col-7">
            <label class="form-label">Root</label>
            <input type="text" class="form-control" name="root" value="${attr:entry.root}">
        </div>
        <div class="col-3">
            <label class="form-label">Import Mode</label>
            <input type="text" class="form-control" name="mode" value="${attr:entry.importMode}"
                   list="packages-filters_mode-options">
        </div>
        <div class="col-2">
            <button type="button" class="btn btn-outline-danger packages-page_filter-root-remove">Remove</button>
        </div>
    </div>
    <textarea class="form-control packages-page_filters-rules" name="rules" rows="3"
              spellcheck="false" placeholder="+ include-pattern&#10;- exclude-pattern">${entry.rulesText}</textarea>
</div>
