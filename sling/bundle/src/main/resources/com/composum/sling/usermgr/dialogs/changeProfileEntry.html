<div class="input-group mb-1 usermgr-page_profile-item">
    <input type="text" class="form-control usermgr-page_profile-name" name="name"
           placeholder="Property name" value="${attr:entry.name}">
    <input type="text" class="form-control usermgr-page_profile-value" name="value"
           placeholder="Value" value="${attr:entry.value}">
    <button type="button" class="btn btn-outline-secondary usermgr-page_profile-remove" tabindex="-1" title="Remove">
        <i class="bi bi-x-lg"></i></button>
</div>
