<div class="input-group mb-1 changes-property_value-item">
    <div class="input-group-text changes-property_value-radio">
        <input type="radio" class="form-check-input mt-0 changes-property_value-select" aria-label="Select this value">
    </div>
    <textarea class="form-control tools-path_input" name="value" rows="2"
              data-suggest-uri="${attr:dialog.pathSuggest}">${value}</textarea>
    <button type="button" class="btn btn-outline-secondary tools-tree_picker-btn"
            data-tree-uri="${attr:dialog.tree}" tabindex="-1" title="Browse...">
        <i class="bi bi-folder2-open"></i></button>
</div>
