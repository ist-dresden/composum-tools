<div class="modal fade tools-dialog" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form class="tools-dialog_form" method="post" action="${attr:dialog.action}" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Move Node</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="tools-dialog_error d-none"></p>
                    <div class="mb-3">
                        <label class="form-label">Destination Path (new parent)</label>
                        <div class="input-group">
                            <input type="text" class="form-control tools-path_input" name="path"
                                   value="${attr:move.path}" data-suggest-uri="${attr:dialog.pathSuggest}" required>
                            <button type="button" class="btn btn-outline-secondary tools-tree_picker-btn"
                                    data-tree-uri="${attr:dialog.tree}" tabindex="-1" title="Browse...">
                                <i class="bi bi-folder2-open"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" value="${attr:move.name}">
                    </div>
                    <small class="text-muted">Leave the Name unchanged to keep it while moving; leave
                        the Destination Path as it already is (its current parent) and only change
                        the Name to rename it in place.</small>
                    ${if:references.available;'<div class="form-check mt-3"><input type="checkbox" class="form-check-input changes-move_adjust-toggle" name="adjustReferences" value="true"><label class="form-check-label">Also adjust path references (path properties, rich-text links) pointing to this node</label></div><div class="mb-3 mt-2 changes-move_references-root d-none"><label class="form-label">Search Root</label><div class="input-group"><input type="text" class="form-control tools-path_input" name="referencesRoot" data-suggest-uri="${attr:dialog.pathSuggest}" placeholder="/ (whole repository)"><button type="button" class="btn btn-outline-secondary tools-tree_picker-btn" data-tree-uri="${attr:dialog.tree}" tabindex="-1" title="Browse..."><i class="bi bi-folder2-open"></i></button></div></div>'}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Move</button>
                </div>
            </form>
        </div>
    </div>
</div>
