<div class="modal fade tools-dialog" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <form class="tools-dialog_form" method="post" action="${attr:dialog.action}" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Filter Roots</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="tools-dialog_error d-none"></p>
                    <p class="packages-page_hint">One include/exclude rule per line in a root's rules box, as
                        '+ pattern' or '- pattern' (pattern is a regular expression matched against the full
                        repository path). The order of the roots is the filter order.</p>
                    <div class="packages-page_filter-roots">
                        ${each.entry:filterRoots;'/sling/packages/dialogs/filterRoot.html'}
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary packages-page_filter-root-add">
                        <i class="bi bi-plus-lg"></i> Add filter root
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
