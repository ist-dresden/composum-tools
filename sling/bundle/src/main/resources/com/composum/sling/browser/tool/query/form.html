<div class="browser-tool_query-head">
    <form class="browser-tool_query-form d-flex align-items-stretch" data-action="${link:query.action}" method="GET">
        <input type="hidden" name="_charset_" value="UTF-8"/>
        ${if:query.templates;'/sling/browser/tool/query/templates.html'}
        <div class="dropdown query-history">
            <button class="btn btn-sm btn-dark bi bi-clock-history" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
            <div class="dropdown-menu"><span class="dropdown-item">the query history is empty</span></div>
        </div>
        <input class="browser-tool_query-field" style="flex-grow:1;" name="query" type="text"/>
        <input class="browser-tool_query-argument hidden" name="arg1" type="text"/>
        <input class="browser-tool_query-argument hidden" name="arg2" type="text"/>
        <input class="browser-tool_query-argument hidden" name="arg3" type="text"/>
        <button type="submit" class="query-submit btn btn-sm btn-dark bi bi-search"></button>
        <div class="dropdown query-save">
            <button class="btn btn-sm btn-dark bi bi-download" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
            <div class="dropdown-menu">
                <a class="query-save-csv query-save_action dropdown-item" href="#" data-uri="${link:query.save.csv}">CSV&nbsp;path|title|text|res-type|prim-type|modified</a>
                <a class="query-save-json query-save_action dropdown-item" href="#" data-uri="${link:query.save.json}">JSON&nbsp;{"path": {"prop-name": prop-value, ...}, ...}</a>
            </div>
        </div>
    </form>
</div>
